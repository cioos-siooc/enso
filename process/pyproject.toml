[project]
name = "enso-process"
version = "0.1.0"
description = "CoralTemp daily NetCDF -> ClickHouse download/ingest/render pipeline"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.8.0",
    "netCDF4>=1.7.0",
    "numpy>=2.0",
    "PyYAML>=6.0",
    # Fetching from NOAA Coral Reef Watch.
    "httpx>=0.27",
    # `run` renders a date's images from the NetCDF via shared/render.py, the
    # same code path the API serves /image from.
    "matplotlib>=3.9",
    "pillow>=11.0",
    # Scheduler + run history UI for the daily `run` (CRW/flows.py). Pinned
    # exactly: it must match the server's version — in prod the shared server at
    # prefect.cioospacific.ca, in dev PREFECT_IMAGE_TAG in docker-compose.dev.yml
    # — since a client newer than its server can send what it cannot read.
    "prefect==3.8.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
