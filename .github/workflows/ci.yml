name: CI

on:
  push:
    branches: [preview]

jobs:
  python:
    name: shared/ (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The process image's own environment: `shared/` is exercised with exactly
      # the dependencies it ships with, pytest from the `dev` group on top.
      - run: uv sync --project process --group dev --python 3.13
      - run: uv run --project process pytest tests

  front:
    name: front/ (lint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      # `install --legacy-peer-deps`, not `ci`: the same resolution
      # front/Dockerfile uses, so CI builds what the image builds.
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The branch's frontend on prod data, as a link: a static client-only build of
  # front/ (nuxt.config.ts's OSTA_SPA) deployed to GitHub Pages under /enso/.
  # Nothing here talks to ClickHouse, so API changes on the branch do not show —
  # the page reads the production API (which allows any origin). PostHog is
  # left blank on purpose, so preview visits are not counted.
  preview:
    name: front/ (preview on GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # A newer push replaces the preview; it never has to wait for an old one.
    concurrency:
      group: pages
      cancel-in-progress: true
    env:
      OSTA_SPA: '1'
      NUXT_APP_BASE_URL: /enso/
      NUXT_PUBLIC_API_BASE_URL: https://mhw-api.cioospacific.ca
      NUXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NUXT_PUBLIC_MAPBOX_TOKEN }}
      NUXT_PUBLIC_VERSION: preview-${{ github.sha }}
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npm run generate
      # Pages serves 404.html for any path it has no file for: the SPA shell
      # there is what makes a deep link like /enso/stories/blob load.
      - run: cp .output/public/200.html .output/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/.output/public
      - id: deploy
        uses: actions/deploy-pages@v4
