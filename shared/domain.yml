# Grid geometry, variable metadata and named regions, shared by `api` and `process`.
#
# Source: NOAA Coral Reef Watch CoralTemp v3.1, 0.05 degree, daily, 1985 onward.
#
# Two grids are described here and they must not be confused:
#
#   `global`  — the full CoralTemp 7200x3600 grid. Cell indices stored in
#               ClickHouse (`gy`, `gx`) are indices into THIS grid, never into
#               the subset, so a cell's identity does not depend on the box.
#               Widening the box needs no REINDEX, but it does need a re-ingest:
#               ingest keeps only the cells inside `subset`, so nothing outside
#               it was ever stored.
#
#   `subset`  — the box actually ingested and rendered. Used for map extents,
#               ingest-time subsetting, and render bounds. Today it is the whole
#               grid (it was the Pacific, 60S-65N 100E-70W, until 2026-09-28).
#
# TWO ORIENTATION FACTS, both of which produce plausible-looking wrong output if
# ignored. `shared/fields.py` is the single place either is applied:
#
#   1. `lon0: 0.025` is a 0-360 convention. The source files are -180..180, so
#      ingest rolls them by half a grid (gx + 3600) % 7200. Without it the
#      Pacific box straddles the array edge and every box query becomes two
#      wrapping ranges. This never reaches Mapbox — `GlobalGrid.gx()` takes
#      either convention on the way in, and `bounds()` hands Mapbox unwrapped
#      100..290, which it accepts (verified in Chromium).
#
#   2. `lat0: -89.975` is south-up, matching the DAILY files. The 366
#      CLIMATOLOGY files are north-up and must be flipped at read time.
#      Subtracting them unflipped yields a global anomaly field in the
#      +/-18 degC range instead of +/-5 — wrong everywhere, and it looks fine.

global:
  resolution: 0.05
  # Cell-centre of index 0 on each axis.
  lat0: -89.975
  lon0: 0.025
  nlat: 3600  # gy in [0, 3599]
  nlon: 7200  # gx in [0, 7199]

subset:
  name: Global
  # The whole CoralTemp grid, poles included: 17,193,140 ocean cells a day
  # (measured from shared/masks/coraltemp_ocean.npz), against the Pacific box's
  # 7,477,923. Cell-centre bounds, degrees_east 0-360; gy 0..3599, gx 0..7199.
  #
  # It was 60S-65N, 100E-70W (gy 600..3099, gx 2000..5799) until 2026-09-28.
  # The `pacific` region carried those bounds until 2026-10-02 and is GOaS's
  # Pacific outline now; see below.
  lat_min: -89.975
  lat_max: 89.975
  lon_min: 0.025
  lon_max: 359.975
  nlat: 3600
  nlon: 7200

# A THIRD grid, for the land layers only: NOAA CPC Global Unified (precip, tmax,
# tmin), 0.5 degree, daily, from NOAA PSL. `land_temp_daily` and
# `land_precip_daily` index THIS grid — same `gy`/`gx` column names as
# `sst_daily`, an entirely different meaning. Nothing joins a land table to an
# ocean one, and nothing should.
#
# LAND IS GLOBAL; the `subset` above is the OCEAN's box and does not
# apply here. The land tables and the land climatology hold the whole grid —
# 259,200 cells, of which ~62,881 carry temperature (55S-83N) and ~93,000
# precipitation (Antarctica included) on a given day. Only the land IMAGE is
# cropped, by `land_image` below.
#
# TWO ORIENTATION FACTS, and they are NOT the ocean's:
#
#   1. `lon0: 0.25` because the CPC files are ALREADY 0-360. This is the one
#      source in the project that needs **no longitude roll** — every other
#      reader in `shared/fields.py` rolls by half the grid, and copying that
#      habit here would draw the Pacific over Africa.
#
#   2. `lat0: -89.75` is south-up, matching `global` — but the CPC files are
#      **north-up** (`lat[0] = +89.75`), so they must be FLIPPED at read time,
#      exactly as the CoralTemp climatology files are. Unflipped, the land layer
#      puts Siberia in the Southern Ocean and renders perfectly plausibly.
land:
  resolution: 0.5
  # Cell-centre of index 0 on each axis.
  lat0: -89.75
  lon0: 0.25
  nlat: 360  # gy in [0, 359]
  nlon: 720  # gx in [0, 719]

# What the land frames cover: every longitude, 60S to 85N. Rain over Antarctica
# stays in the database; Mercator stretches it past usefulness and nothing about
# ENSO is read there, so it is not drawn.
#
# The frame is NOT an independent raster: it is the OCEAN frame's own pixel
# grid (same pixel width in degrees, same Mercator row pitch, same south edge)
# carried round to -180..180, so the coastline cut can keep land and ocean from
# overlapping. `render.land_canvas()` computes the edges, which fall on that
# grid a fraction of a pixel inside +-180 and 85N.
#
# It stops at +-180 rather than extending the ocean frame across the dateline
# because Mapbox draws a 360-degree image source only in the world copy nearest
# the camera (measured, flat projection): a frame spanning ~-30..330 showed no
# Americas with the camera on Asia, and explicit copies at +-360 did not help.
# The cost is that 360 degrees is not a whole number of the ocean's pixels, so
# east of the dateline the two grids are offset by a fixed fraction of a pixel.
# There the cut drops a land pixel that touches ANY ocean pixel, leaving at
# most a one-pixel strip of basemap land along the Americas' Pacific coast —
# a coastline, never an overlap.
land_image:
  south: -60
  north: 85

variables:
  sst:
    long_name: Daily sea surface temperature
    short_name: SST
    units: degC
    precision: 2
    # Source encoding: short * scale_factor + add_offset, _FillValue -32768.
    scale_factor: 0.01
    add_offset: 0.0
    fill_value: -32768
    # SEQUENTIAL, and it must stay that way: an absolute temperature has no
    # meaningful midpoint, so a diverging map would invent one and read as a
    # signed field. Range covers the ocean from freezing to the warm pool.
    vmin: -2.0
    vmax: 32.0
    colormap: turbo
    # Named bands the colour-range control offers as one-click shortcuts.
    #
    # The DEFAULT range is deliberately not listed here — it is `vmin`/`vmax`
    # above, and the control synthesises its chip from them, so there is one
    # definition of it rather than two that drift apart the first time one is
    # edited. Every band must lie inside `limits` below; `shared/domain.py`
    # raises on one that does not, because the frontend would otherwise clamp it
    # silently and the chip would land somewhere other than its label.
    #
    # Narrowing to a band CLAMPS the rest of the ocean to the end colours rather
    # than hiding it: the band gets all 256 ramp entries, which is what makes it
    # readable, but water outside it is still coloured.
    presets:
      - {label: Coral, vmin: 24.0, vmax: 32.0}
      - {label: Tropical, vmin: 20.0, vmax: 32.0}
      - {label: Temperate, vmin: 10.0, vmax: 25.0}
      - {label: Cold, vmin: -2.0, vmax: 12.0}
    # How far the user may drag the displayed range, which is NOT the encoding's
    # limit: two bytes at 0.1 degC reach 6550 degC, and a control bounded by that
    # would be almost entirely above the boiling point. -2 is the freezing point
    # of seawater and the data's own floor; 36 clears the warmest ocean SST
    # anywhere on Earth, and the Pacific box peaks near 32.
    limits: [-2.0, 36.0]
    # How the value is packed into the WebP the map consumes. The image carries
    # DATA, not colour: Mapbox does the colouring with `raster-color`, so the
    # palette and the displayed range are client-side settings and changing
    # either costs nothing. See shared/render.py.
    #
    # Two channels, high byte first: value = (G*256 + B) * scale + offset. One
    # byte would be 0.134 degC across the display range, which is visibly
    # posterized when the map is zoomed in, so two it is.
    #
    # 0.1 degC, not the source's 0.01, since the 2026-09 global render: the last
    # digit compresses like noise, and 0.1 halved a global 4096 frame (2.99 MB
    # to ~1.6 MB a day, measured over August/September 2026) with no difference
    # visible side by side in the app. The chart and the numbers still read
    # 0.01 from ClickHouse; only the map is at 0.1.
    encoding:
      channels: [G, B]
      scale: 0.1
      offset: -5.0
  anom:
    long_name: Daily sea surface temperature anomaly
    short_name: SST anomaly
    units: degC
    precision: 2
    scale_factor: 0.01
    add_offset: 0.0
    fill_value: -32768
    # DIVERGING about zero. Daily values reach about +/-5 at the extremes, but
    # saturating at +/-3 is what makes an ordinary day readable rather than
    # uniformly pale.
    vmin: -3.0
    vmax: 3.0
    colormap: RdBu_r
    # See `presets` under `sst`. Two bands rather than four: an anomaly is
    # already centred on zero, so the only question is how much of it to spend
    # on an ordinary day (+/-1, where a quiet basin still has structure) versus
    # an ENSO peak (+/-5, which is where the daily extremes actually reach).
    presets:
      - {label: Fine, vmin: -1.0, vmax: 1.0}
      - {label: Wide, vmin: -5.0, vmax: 5.0}
    # Not stored. Computed as `sst - climatology(mmdd)` at query and render
    # time; see `sst_clim` in shared/ch.py. About 3.2% of the box's ocean cells
    # have SST but no climatology (the seasonal ice fringe, which the source
    # flags explicitly) and have no anomaly at all — rendered neutral grey
    # rather than transparent, which would read as land, or as a scale colour,
    # which would read as zero.
    derived: true
    # What the sentinel grey means HERE. The rainfall ratio uses the same grey for
    # a different reason, so the legend reads this rather than assuming.
    no_value_label: No climatology (seasonal ice edge)
    # One byte at 0.1 degC, so byte 1..255 spans -12.7..+12.7 and byte 0 is the
    # no-climatology sentinel. Measured over 60 days spread across the archive
    # plus the strong ENSO peaks, the anomaly reaches -10.22..+14.05 degC, so
    # this range CLIPS about 4 cells a day out of 7.5 million — all of them
    # already saturated at the +/-3 display range, hence invisible. Values are
    # CLAMPED, never wrapped: a uint8 overflow would flip a hot cell to the
    # coldest colour on the scale.
    encoding:
      channels: [R]
      scale: 0.1
      offset: -12.8
      sentinel: 0
    # WHAT THIS IS MEASURED AGAINST. Declared here so it is said once: it used
    # to be a constant in api/modules/timeseries.py, another in
    # api/modules/state.py, and a literal in ranking.ts and AboutDialog.vue.
    #
    # Note the contrast with `mhw` below, which is the point of putting both in
    # one file where they can be read side by side. Different years, a different
    # window and a different statistic — so an anomaly and a category are NOT
    # two views of the same departure.
    baseline:
      period: '1991-2020'
      statistic: mean
      window_days: 1
      label: the 1991-2020 daily mean
      computed_by: here
      note: >-
        Each day is compared with the average of that same calendar day over
        1991-2020, from NOAA Coral Reef Watch's CoralTemp v3.1 daily
        climatology. This is the current WMO 30-year normal, and it is the same
        baseline NOAA's own CoralTemp SST anomaly product uses. It is NOT the
        baseline behind the marine heatwave categories.
  mhw:
    long_name: Marine heatwave category
    short_name: MHW
    # Not a physical unit — the value is an ordinal class, not a measurement.
    # Everything that prints "degC" has to consult this rather than assume.
    units: category
    precision: 0
    # NOAA CRW Marine Heatwave v1.0.1, `heatwave_category`, int8 counts that are
    # already the category — no scaling. -127 is land; -1 is ice; 0 is ocean with
    # no heatwave. Only 1..5 are ingested and only 1..5 are drawn.
    scale_factor: 1.0
    add_offset: 0.0
    fill_value: -127
    vmin: 1.0
    vmax: 5.0
    # CATEGORICAL, and it changes three things that are otherwise automatic:
    # the Mercator resample is nearest-neighbour rather than bilinear (blending
    # a Cat 2 against a Cat 4 would invent a Cat 3 along every edge), the colour
    # ramp is a `step` rather than an `interpolate`, and the displayed range is
    # not user-adjustable — there is nothing between two categories to re-range.
    categorical: true
    # THE OFFICIAL NOAA PALETTE, not a colormap sampled at five points.
    # Extracted from NOAA's own plain PNG for 2023-10-01 by matching every pixel
    # against that date's NetCDF: all five categories matched 100%, as did the
    # three non-heatwave classes (land #969696, ice #ffffff, no-heatwave
    # #b3f2ff) — which this project draws transparent instead.
    #
    # `colors` replaces `colormap`: matplotlib has no say here, because the point
    # of these five is that people already recognise them from NOAA's own maps.
    # NOAA's no-heatwave blue, from that same pixel match. The raster itself
    # cannot carry it: land, ice and heatwave-free ocean are ALL alpha 0 in the
    # WebP, so the ramp never sees a code 0 to colour. It is drawn instead as a
    # flat fill under the raster, covering the image quad — which is exact only
    # because the basemap's land sits ABOVE the field layers in the style, so
    # the blue shows through at the heatwave-free ocean and nowhere else.
    background_color: '#b3f2ff'
    colors:
      - {value: 1, color: '#ffff80', label: Moderate}
      - {value: 2, color: '#ffb333', label: Strong}
      - {value: 3, color: '#ff8000', label: Severe}
      - {value: 4, color: '#cc4d00', label: Extreme}
      - {value: 5, color: '#991a00', label: Beyond extreme}
    # The whole scale. A categorical range is not draggable, so this exists only
    # so `range_limits()` has something bounded to report.
    limits: [1.0, 5.0]
    # One byte holding the category itself, so code == value. Land, ice and
    # no-heatwave ocean are all NaN before encoding and land in **alpha 0** —
    # transparent, as asked: the only thing this layer draws is a heatwave.
    #
    # There is no sentinel, but the ramp is still tabulated over the *whole*
    # encoding range (0..255) rather than over 1..5, so that ramp entry k is
    # exactly code k. Tabulating 256 entries over 1..5 would put code 2 at entry
    # 63.75 and let a Cat 2 pick up Cat 1's colour. See `SERVER.py`'s /domain.
    encoding:
      channels: [R]
      scale: 1.0
      offset: 0.0
    # A DIFFERENT BASELINE FROM `anom` ABOVE, and the reason this block exists.
    #
    # The category is not computed here. NOAA applies the Hobday algorithm to
    # CoralTemp and publishes the finished class, so this baseline is a fact
    # about the incoming file, not a choice this project can revisit: nothing in
    # this database could re-base it. Hence `computed_by: noaa`.
    #
    # `statistic: p90` is the part that matters most. Cat 1 is SST above the
    # 90th percentile, which is an EXCEEDANCE, not a departure from the mean —
    # and the gap between the two varies by cell. Measured over this box for day
    # 001: P90 minus mean averages +1.02 degC, p5 +0.60, p95 +1.62. So there is
    # no anomaly value that corresponds to a category anywhere, and re-basing
    # `anom` onto these same years would not change that (the two means differ
    # by only +0.104 degC over the box, ~10% of that spread).
    #
    # 11-day window, and Feb 29 is excluded from NOAA's calculation entirely —
    # derived instead as the mean of Feb 28 and Mar 1 — which is why that
    # climatology ships 365 files against our 366.
    baseline:
      period: '1985-2012'
      statistic: p90
      window_days: 11
      # No "NOAA's" here: `computed_by` already says who applied it, and the
      # inline note appends that, which read as "NOAA's ... applied by NOAA".
      label: the 1985-2012 90th percentile
      computed_by: noaa
      note: >-
        A marine heatwave is a day whose temperature exceeds the 90th percentile
        of an 11-day window centred on that day of the year, over 1985-2012, and
        the category counts how many multiples of that threshold's departure it
        reaches. This is a percentile exceedance, not a departure from an
        average, and it uses different years from the anomaly, so a +1 °C
        anomaly does not correspond to any particular category.
      # The method is not NOAA's. NOAA applies it and publishes the product; the
      # definition and the five category names are Hobday and colleagues'. Cited
      # because a user asked for it, and because attributing someone else's
      # method to the data provider is a real misattribution rather than a
      # missing nicety.
      references:
        - authors: Hobday et al.
          year: 2016
          title: A hierarchical approach to defining marine heatwaves
          source: Progress in Oceanography 141, 227-238
          url: https://doi.org/10.1016/j.pocean.2015.12.014
        - authors: Hobday et al.
          year: 2018
          title: Categorizing and naming marine heatwaves
          source: Oceanography 31(2)
          url: https://doi.org/10.5670/oceanog.2018.205
        - authors: Oliver et al.
          year: 2018
          title: Longer and more frequent marine heatwaves over the past century
          source: Nature Communications 9, 1324
          url: https://doi.org/10.1038/s41467-018-03732-9

  # --- The land layers: NOAA CPC Global Unified, on the `land` grid ----------
  #
  # A MAP OVERLAY, not a fourth variable of the toggle. The frontend's ocean
  # toggle is a hard-coded list (`TimeControl.vue`), so declaring these here
  # adds nothing to it; they are drawn by their own control, over whichever ocean
  # variable is showing, and the chart, stats and rankings stay ocean.
  #
  # All six render to the SAME image bounds as the ocean: `render.bounds()`
  # returns cell edges, and both grids' edges are exactly -60..65N, 100..290E.
  # Where land and ocean rasters meet, the land raster's 0.5-degree blocks are
  # coarser than the coastline — see FieldMap.vue for which one wins.
  #
  # What each layer is MADE of is declared (`source`, `transform`), not coded:
  # `shared.buckets` reads these and has no name table of its own.
  #
  # Buckets, decided and measured (see ROADMAP.md B6):
  #   * tmax/tmin: the MEAN of the dailies ("average daily high"), which is
  #     what a normal is — never the max, which would compare a weekly extreme
  #     against a mean.
  #   * precip: mean mm/DAY, not a total, so one legend serves daily, weekly and
  #     monthly exactly as `mhw`'s does. A ratio of means is a ratio of totals,
  #     so the anomaly layer is unaffected by the choice.
  #
  # `resampling: nearest` on all six: a 0.5-degree cell is ~55 km, and blending
  # between cell centres would draw gradients the gauge analysis never resolved.
  # Land history is on disk forever, so this is cheap to revisit.
  land_tmax:
    long_name: Daily maximum land temperature
    short_name: Tmax
    units: degC
    precision: 1
    grid: land
    source: tmax
    resampling: nearest
    vmin: -20.0
    vmax: 40.0
    colormap: turbo
    presets:
      - {label: Tropics, vmin: 20.0, vmax: 40.0}
      - {label: Cold, vmin: -40.0, vmax: 10.0}
    # The source declares valid_range -90..50; the box's measured extremes are
    # about -55..48. -60..55 clears both without spending the control on the
    # encoding's arithmetic headroom.
    limits: [-60.0, 55.0]
    # Two bytes at 0.01 degC. The frame is ~22 KB either way (the 0.5-degree
    # source upsamples into flat blocks), so a second byte costs nothing and the
    # stored precision survives the trip.
    encoding:
      channels: [G, B]
      scale: 0.01
      offset: -100.0
  land_tmin:
    long_name: Daily minimum land temperature
    short_name: Tmin
    units: degC
    precision: 1
    grid: land
    source: tmin
    resampling: nearest
    vmin: -30.0
    vmax: 30.0
    colormap: turbo
    presets:
      - {label: Tropics, vmin: 10.0, vmax: 30.0}
      - {label: Cold, vmin: -50.0, vmax: 0.0}
    limits: [-60.0, 55.0]
    encoding:
      channels: [G, B]
      scale: 0.01
      offset: -100.0
  land_precip:
    long_name: Daily land precipitation
    short_name: Precipitation
    # A RATE, not a total, and the same unit at every period: a weekly frame is
    # the mean daily rainfall over that week. The frontend can label the total
    # (x days in the bucket); the raster carries one scale.
    units: mm/day
    precision: 1
    grid: land
    source: precip
    resampling: nearest
    vmin: 0.0
    vmax: 20.0
    colormap: YlGnBu
    # The first three quarters only. YlGnBu's last quarter runs from mid blue to
    # near-black navy (#081d58), which is the heaviest precipitation drawn
    # almost invisible on the dark basemap and the chart: the values a
    # precipitation map is read for.
    colormap_range: [0.0, 0.75]
    # Rainfall is heavily skewed — measured, 58% of the box's land is dry on a
    # typical day while a wet-season cell passes 30 mm/day as a monthly mean —
    # so the bands are the answer to that rather than a log scale on the raw
    # value, which the ratio layer already is.
    presets:
      - {label: Arid, vmin: 0.0, vmax: 2.0}
      - {label: Monsoon, vmin: 0.0, vmax: 50.0}
    limits: [0.0, 100.0]
    # Two bytes at 0.01 mm/day, 0..655.35. A single day can exceed that
    # somewhere on Earth (666.7 mm measured globally) and is CLAMPED, never
    # wrapped — see `render.encode`. Box maximum measured in 2015: 494.
    encoding:
      channels: [G, B]
      scale: 0.01
      offset: 0.0
  land_tmax_anom:
    long_name: Daily maximum land temperature anomaly
    short_name: Tmax anomaly
    units: degC
    precision: 1
    grid: land
    source: tmax
    transform: difference
    resampling: nearest
    # WIDER THAN THE OCEAN'S +/-3, deliberately. Land is far more variable:
    # measured, the within-month day-to-day spread of tmax is ~5 degC north of
    # 45N (p99 ~10) against an ocean anomaly that saturates at +/-3 for the
    # whole field. The two cannot share a legend, which is why the land layer
    # has its own.
    vmin: -8.0
    vmax: 8.0
    colormap: RdBu_r
    presets:
      - {label: Fine, vmin: -3.0, vmax: 3.0}
      - {label: Wide, vmin: -15.0, vmax: 15.0}
    limits: [-25.0, 25.0]
    # Two bytes, not the ocean anomaly's one: one byte at 0.1 degC tops out at
    # +/-12.7, uncomfortably close to real continental winter anomalies.
    encoding:
      channels: [G, B]
      scale: 0.01
      offset: -327.68
    baseline:
      period: '1991-2020'
      statistic: mean
      # SMOOTHED over the day of year, unlike the ocean's window-1 climatology.
      # SST is smooth enough for a raw per-day mean; land tmax is not — a
      # 30-year mean per calendar day carries ~5 degC of daily spread over
      # sqrt(30), which would flicker into every daily anomaly frame. 15 days
      # cuts that several-fold and biases the seasonal peak by well under 0.1.
      window_days: 15
      label: the 1991-2020 mean for the time of year
      computed_by: here
      note: >-
        Each day is compared with the 1991-2020 average of the daily maximum
        temperature around that time of year — a 15-day window centred on the
        calendar day — computed in this project from NOAA CPC Global Unified.
        Weekly and monthly frames average the daily departures. Land varies far
        more than the ocean, so this layer has its own, wider colour scale.
  land_tmin_anom:
    long_name: Daily minimum land temperature anomaly
    short_name: Tmin anomaly
    units: degC
    precision: 1
    grid: land
    source: tmin
    transform: difference
    resampling: nearest
    vmin: -8.0
    vmax: 8.0
    colormap: RdBu_r
    presets:
      - {label: Fine, vmin: -3.0, vmax: 3.0}
      - {label: Wide, vmin: -15.0, vmax: 15.0}
    limits: [-25.0, 25.0]
    encoding:
      channels: [G, B]
      scale: 0.01
      offset: -327.68
    baseline:
      period: '1991-2020'
      statistic: mean
      window_days: 15
      label: the 1991-2020 mean for the time of year
      computed_by: here
      note: >-
        Each day is compared with the 1991-2020 average of the daily minimum
        temperature around that time of year — a 15-day window centred on the
        calendar day — computed in this project from NOAA CPC Global Unified.
        A warm El Nino winter in western Canada shows up most clearly here, in
        the nights.
  land_precip_ratio:
    long_name: Land precipitation relative to normal
    short_name: Precip vs normal
    # The NUMBER is log2(actual / normal); `display` below is what the legend
    # prints. Stored as a log so a halving (-1) and a doubling (+1) sit the same
    # distance from normal (0). Measured, linear percent-of-normal puts every
    # possible drought into 0..100% while wet runs past 700%, which would make
    # the dry half — what El Nino does to Indonesia and Australia — the
    # unreadable one.
    units: log2 ratio
    display: log2_percent
    precision: 2
    grid: land
    source: precip
    transform: log2_ratio
    resampling: nearest
    # WEEKLY AND MONTHLY ONLY. A daily rainfall anomaly is noise: most days are
    # dry most places, so a daily ratio is mostly 0% or a huge multiple.
    periods: [weekly, monthly]
    # A normal below this makes the ratio meaningless — one 0.5 mm shower over a
    # 0.05 mm/day normal would read as 1000%. Measured: 7% of the box's land in
    # January. Those cells draw the sentinel grey, the same third state the ocean
    # anomaly uses for its ice fringe and for the same reason: there is a value,
    # but no meaningful departure from normal.
    min_normal: 0.1
    no_value_label: Too dry for a ratio (normal under 0.1 mm/day)
    # 25% .. 400% of normal.
    vmin: -2.0
    vmax: 2.0
    # Brown for dry, teal for wet — the convention for rainfall anomalies, and
    # visibly not the temperature layers' red/blue.
    colormap: BrBG
    presets:
      - {label: Narrow, vmin: -1.0, vmax: 1.0}
      - {label: Wide, vmin: -3.0, vmax: 3.0}
    limits: [-4.0, 4.0]
    # One byte at 1/32 of a doubling, code 0 the too-dry sentinel. Code 128 is
    # exactly 0 (normal); 1..255 spans -3.97..+3.97, i.e. 6%..1570% of normal.
    # A bone-dry bucket is floored at 2^-4 before encoding rather than sent to
    # log2(0) = -inf, so it lands on the driest colour rather than wrapping.
    encoding:
      channels: [R]
      scale: 0.03125
      offset: -4.0
      sentinel: 0
    baseline:
      period: '1991-2020'
      statistic: mean
      # A 7-day window, not 15: this layer is only drawn weekly and monthly,
      # where averaging over the bucket already smooths the normal. 7 steadies
      # the weekly normal and blurs a month's by only +/-3 days, so a sharp
      # monsoon onset keeps its month.
      window_days: 7
      label: the 1991-2020 mean for the time of year
      computed_by: here
      note: >-
        Precipitation over the week or month as a share of the 1991-2020 average
        for the same days of the year, computed in this project from NOAA CPC
        Global Unified. 100% is normal, 50% half the usual amount, 200% double.
        Cells that normally get almost no precipitation at that time of year
        are shown grey, because a ratio there is meaningless.

  land_precip_anom:
    long_name: Land precipitation anomaly
    short_name: Precip anomaly
    # The ABSOLUTE departure, beside the ratio above rather than instead of it.
    # The two answer different questions: the ratio says how unusual a bucket
    # is for that place, and a desert at 300% of a 0.2 mm/day normal is a big
    # ratio of almost no water; this says how much water went missing or
    # arrived, which is what a drought over Indonesia is actually made of.
    # No single colour range suits both a desert and a monsoon, which is why
    # the range is the user's (presets below) and the ratio stays the default.
    units: mm/day
    precision: 1
    grid: land
    source: precip
    transform: difference
    resampling: nearest
    # Weekly and monthly only, for the ratio's reason: a daily departure is
    # mostly a dry day against a small normal, or one storm.
    periods: [weekly, monthly]
    # Measured over four global buckets, the middle 90% of land cells sit
    # within about +/-1.6 mm/day on a month and +/-3 on a week, with tails to
    # -18 and +42; +/-3 saturates only the wettest and driest percent of a month.
    vmin: -3.0
    vmax: 3.0
    colormap: BrBG
    presets:
      - {label: Fine, vmin: -1.0, vmax: 1.0}
      - {label: Monsoon, vmin: -10.0, vmax: 10.0}
    limits: [-50.0, 50.0]
    # Two bytes at 0.01 mm/day, the value layer's precision, centred: +/-327.67,
    # beyond any weekly mean departure the record holds.
    encoding:
      channels: [G, B]
      scale: 0.01
      offset: -327.68
    baseline:
      period: '1991-2020'
      statistic: mean
      # The same 7-day window as the ratio, and so the same climatology file.
      window_days: 7
      label: the 1991-2020 mean for the time of year
      computed_by: here
      note: >-
        Precipitation over the week or month minus the 1991-2020 average for
        the same days of the year, in mm per day, computed in this project from
        NOAA CPC Global Unified. Negative is drier than normal, positive wetter.

# How the region menu is grouped, in menu order. Every region names one.
region_groups:
  canada: Canadian waters
  basins: Ocean basins
  enso: ENSO and its relatives
  north_pacific: North Pacific
  mhw: Marine heatwave hotspots

# Named boxes for area-mean indices. Bounds are inclusive cell-centre ranges in
# degrees_east (0-360) / degrees_north, and all of them fit inside `subset`.
regions:
  # --- The Pacific basin, as a region: GOaS's outline, not a box.
  #
  # It exists because the basin-wide numbers the header ribbon reports — how much
  # of the Pacific is in a marine heatwave today, against what is normal for the
  # date — are exactly a region rollup over it. Adding it here rather than
  # writing a second aggregation path means `region_daily`, `region_clim`,
  # `/region/{key}`, the monthly ranking and the CSV export all serve it with no
  # new code.
  #
  # Until 2026-10-02 it was the old ingested box (60S-65N, 100E-70W), which put
  # the Gulf of Mexico, the Caribbean, Hudson Bay and the eastern Indian Ocean
  # into "the Pacific". It is now GOaS's North + South Pacific plus its South
  # China and Eastern Archipelagic Seas, which GOaS keeps as a region of its own
  # and the old box held; dropping them would take the warm pool out of an ENSO
  # dashboard's basin. Changing the outline changes what every stored row for
  # this key means, so it needs `rollup --clim --region pacific --fresh`.
  pacific:
    group: basins
    label: Pacific Ocean (GOaS)
    polygon: pacific.geojson
    about:
      why: >-
        The ocean ENSO happens in. El Niño and La Niña reorganise sea surface
        temperature across the whole basin, and their effects on weather reach
        far beyond it. This is also the area the header's heatwave sentence
        reports on.
      definition: >-
        The North and South Pacific of the Global Oceans and Seas dataset, plus
        its South China and Eastern Archipelagic Seas, so the western Pacific
        warm pool is included. From 60°S to the Bering Strait; the Gulf of
        Mexico and the Caribbean are excluded.
      references:
        - authors: McPhaden, Zebiak & Glantz
          year: 2006
          title: "ENSO as an integrating concept in Earth science"
          source: "Science 314, 1740-1745"
          url: "https://doi.org/10.1126/science.1132588"
        - authors: Flanders Marine Institute (VLIZ)
          year: 2021
          title: "Global Oceans and Seas, version 1"
          source: "Marine Regions"
          url: "https://doi.org/10.14284/542"
  # --- ENSO indices, computable for the first time now the domain reaches
  # south of the equator.
  nino34:
    group: enso
    label: Nino 3.4
    lat: [-5.0, 5.0]
    lon: [190.0, 240.0]
    about:
      why: >-
        The standard El Niño / La Niña index region. NOAA's Oceanic Niño Index
        is the three-month running mean of its temperature anomaly, and the
        dashboard's ENSO phase is computed from it the same way.
      definition: >-
        5°S-5°N, 170°W-120°W. Barnston et al. (1997) identified it as the region
        whose temperature tracks ENSO most closely. It straddles the boundary
        between Niño 3 and Niño 4, overlapping both.
      references:
        - authors: Barnston, Chelliah & Goldenberg
          year: 1997
          title: "Documentation of a highly ENSO-related SST region in the equatorial Pacific"
          source: "Atmosphere-Ocean 35(3), 367-383"
          url: "https://doi.org/10.1080/07055900.1997.9649597"
        - authors: Trenberth
          year: 1997
          title: "The Definition of El Niño"
          source: "Bulletin of the American Meteorological Society 78(12), 2771-2777"
          url: "https://doi.org/10.1175/1520-0477(1997)078<2771:TDOENO>2.0.CO;2"
        - authors: NOAA Climate Prediction Center
          title: "Oceanic Niño Index (ONI): cold and warm episodes by season"
          source: "NOAA CPC"
          url: "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php"
  nino3:
    group: enso
    label: Nino 3
    lat: [-5.0, 5.0]
    lon: [210.0, 270.0]
    about:
      why: >-
        The eastern equatorial Pacific, where the strongest eastern Pacific El
        Niños (1982/83, 1997/98) produced their largest warming. It was the main
        ENSO monitoring region before Niño 3.4 took over.
      definition: >-
        5°S-5°N, 150°W-90°W, one of the standard Niño regions in use since the
        1980s. Trenberth (1997) reviews how the regions came about.
      references:
        - authors: Trenberth
          year: 1997
          title: "The Definition of El Niño"
          source: "Bulletin of the American Meteorological Society 78(12), 2771-2777"
          url: "https://doi.org/10.1175/1520-0477(1997)078<2771:TDOENO>2.0.CO;2"
        - authors: Rasmusson & Carpenter
          year: 1982
          title: "Variations in tropical sea surface temperature and surface wind fields associated with the Southern Oscillation/El Niño"
          source: "Monthly Weather Review 110(5), 354-384"
          url: "https://doi.org/10.1175/1520-0493(1982)110<0354:VITSST>2.0.CO;2"
  nino4:
    group: enso
    label: Nino 4
    lat: [-5.0, 5.0]
    lon: [160.0, 210.0]
    about:
      why: >-
        The central and western equatorial Pacific, at the edge of the warm
        pool. When El Niño's warming is concentrated here rather than in the
        east, it is called a central Pacific or "Modoki" El Niño, which shifts
        rainfall around the world differently.
      definition: >-
        5°S-5°N, 160°E-150°W, one of the standard Niño regions.
      references:
        - authors: Trenberth
          year: 1997
          title: "The Definition of El Niño"
          source: "Bulletin of the American Meteorological Society 78(12), 2771-2777"
          url: "https://doi.org/10.1175/1520-0477(1997)078<2771:TDOENO>2.0.CO;2"
        - authors: Ashok et al.
          year: 2007
          title: "El Niño Modoki and its possible teleconnection"
          source: "Journal of Geophysical Research: Oceans 112, C11007"
          url: "https://doi.org/10.1029/2006JC003798"
  nino12:
    group: enso
    label: Nino 1+2
    lat: [-10.0, 0.0]
    lon: [270.0, 280.0]
    about:
      why: >-
        The waters off Ecuador and northern Peru. Warming here is the "coastal
        El Niño" that brings heavy rain to the Peruvian coast and disrupts its
        fisheries. Eastern Pacific warming behaves as a separate regime from
        central Pacific warming, so it can differ from the basin-wide picture.
      definition: >-
        10°S-0°, 90°W-80°W, one of the standard Niño regions.
      references:
        - authors: Trenberth
          year: 1997
          title: "The Definition of El Niño"
          source: "Bulletin of the American Meteorological Society 78(12), 2771-2777"
          url: "https://doi.org/10.1175/1520-0477(1997)078<2771:TDOENO>2.0.CO;2"
        - authors: Takahashi et al.
          year: 2011
          title: "ENSO regimes: Reinterpreting the canonical and Modoki El Niño"
          source: "Geophysical Research Letters 38, L10704"
          url: "https://doi.org/10.1029/2011GL047364"
  # --- North Pacific / marine-heatwave boxes.
  ne_pacific:
    group: north_pacific
    label: NE Pacific (the Blob)
    lat: [40.0, 60.0]
    lon: [200.0, 235.0]
    about:
      why: >-
        The core of "the Blob", the 2014-2016 marine heatwave, one of the
        largest on record. It persisted for more than two years and disrupted
        fisheries, seabirds and marine mammals from California to Alaska.
      definition: >-
        40°N-60°N, 160°W-125°W. A box chosen for this dashboard to cover the
        anomaly's core as mapped by Bond et al. (2015). It is not a published
        index region.
      references:
        - authors: Bond et al.
          year: 2015
          title: "Causes and impacts of the 2014 warm anomaly in the NE Pacific"
          source: "Geophysical Research Letters 42, 3414-3420"
          url: "https://doi.org/10.1002/2015GL063306"
        - authors: Di Lorenzo & Mantua
          year: 2016
          title: "Multi-year persistence of the 2014/15 North Pacific marine heatwave"
          source: "Nature Climate Change 6, 1042-1047"
          url: "https://doi.org/10.1038/nclimate3082"
  gulf_of_alaska:
    group: north_pacific
    label: Gulf of Alaska
    lat: [50.0, 60.0]
    lon: [205.0, 225.0]
    about:
      why: >-
        Where the 2014-2016 heatwave's ecological damage was clearest: Gulf of
        Alaska Pacific cod collapsed and its federal fishery was closed in 2020,
        and around a million common murres died of starvation.
      definition: >-
        50°N-60°N, 155°W-135°W. A box chosen for this dashboard; it is not a
        published index region.
      references:
        - authors: Piatt et al.
          year: 2020
          title: "Extreme mortality and reproductive failure of common murres resulting from the northeast Pacific marine heatwave of 2014-2016"
          source: "PLOS ONE 15(1), e0226087"
          url: "https://doi.org/10.1371/journal.pone.0226087"
        - authors: Barbeaux, Holsman & Zador
          year: 2020
          title: "Marine heatwave stress test of ecosystem-based fisheries management in the Gulf of Alaska Pacific cod fishery"
          source: "Frontiers in Marine Science 7, 703"
          url: "https://doi.org/10.3389/fmars.2020.00703"
  bering_sea:
    group: north_pacific
    label: Bering Sea
    lat: [55.0, 65.0]
    lon: [180.0, 200.0]
    about:
      why: >-
        A shallow sea whose ecosystem depends on winter sea ice. 2017-2018
        brought record-low ice, and after the warm years that followed, the
        eastern Bering Sea snow crab population collapsed and its fishery was
        closed.
      definition: >-
        55°N-65°N, 180°-160°W. A box chosen for this dashboard; it is not a
        published index region. In winter much of it is ice-covered, and ice-
        covered cells have no anomaly, so the winter anomaly covers only its
        open water.
      references:
        - authors: Stabeno & Bell
          year: 2019
          title: "Extreme conditions in the Bering Sea (2017-2018): Record-breaking low sea-ice extent"
          source: "Geophysical Research Letters 46, 8952-8959"
          url: "https://doi.org/10.1029/2019GL083816"
        - authors: Szuwalski et al.
          year: 2023
          title: "The collapse of eastern Bering Sea snow crab"
          source: "Science 382, 306-310"
          url: "https://doi.org/10.1126/science.adf6035"
  pdo_north_pacific:
    group: north_pacific
    label: North Pacific (PDO domain)
    # The conventional PDO domain runs to 70N; clipped to the subset's 65N.
    lat: [20.0, 65.0]
    lon: [180.0, 250.0]
    about:
      why: >-
        The Pacific Decadal Oscillation is the main pattern of North Pacific
        temperature change over decades, first described through its link to
        salmon catches. Its phase changes the background against which ENSO and
        heatwaves like the Blob play out.
      definition: >-
        20°N-65°N, 180°-110°W: the central and eastern part of the domain the
        PDO is defined over (the Pacific north of 20°N). The PDO index itself is
        not an area mean: it is the leading pattern of temperature anomalies. A
        positive PDO warms the coast and cools the central North Pacific, so
        this box averages both halves of the pattern and does not stand in for
        the index.
      references:
        - authors: Mantua et al.
          year: 1997
          title: "A Pacific interdecadal climate oscillation with impacts on salmon production"
          source: "Bulletin of the American Meteorological Society 78(6), 1069-1079"
          url: "https://doi.org/10.1175/1520-0477(1997)078<1069:APICOW>2.0.CO;2"
        - authors: Newman et al.
          year: 2016
          title: "The Pacific Decadal Oscillation, revisited"
          source: "Journal of Climate 29, 4399-4427"
          url: "https://doi.org/10.1175/JCLI-D-15-0508.1"
  # --- Canadian waters: Fisheries and Oceans Canada's Federal Marine
  # Bioregions. Each marine bioregion is its own region except the Arctic
  # Archipelago, which is under ice in every day of the 1991-2020 climatology
  # (no anomaly) and has never had a heatwave day: only a flat SST near freezing.
  # The Great Lakes are left out because CoralTemp has no water there (all four
  # lakes checked are land in `masks/coraltemp_ocean.npz`).
  #
  # WHERE A BOUNDARY IS DISPUTED, THE REGION FOLLOWS CANADA'S POSITION, which is
  # what DFO's file already draws: the 141st meridian in the Beaufort Sea, the
  # A-B line in Dixon Entrance, the water seaward of Juan de Fuca, and Machias
  # Seal Island and North Rock in the Gulf of Maine. Do not swap in an outline
  # that splits these on a median line.
  #
  # Every file is built the way `pacific_bioregions.geojson` was (island holes
  # dropped, longitudes 0-360), with one exception that matters: Saint-Pierre et
  # Miquelon's French zone is a HOLE in the Newfoundland-Labrador Shelves, not an
  # island, so `nl_shelves` keeps it as an interior ring (`Region.holes`).
  # Dropping it with the islands put 590 cells of French water inside a Canadian
  # region. That boundary is settled (1992 arbitration), not disputed.
  #
  # The Arctic ones are ice-covered for much of the year. CoralTemp still has an
  # SST there, so `sst` and `mhw` extent average over the ice, but `anom` only
  # covers the cells with a climatology, which in winter is far fewer.
  # --- The first polygon region, and the one that set the rules.
  #
  # Canada's Pacific waters are not a rectangle: the bounding box is 55,533
  # cells against the region's 26,222, so 53% of what a box query would average
  # is Alaskan, American or high-seas water. So this region declares a POLYGON
  # and no bounds — `shared/domain.py` derives the box from the ring (the
  # prefilter that keeps the key-range read) and `shared/mask.py` rasterises the
  # ring into `region_cells`, which every aggregation intersects with. See both
  # for why the mask is materialised.
  #
  # PROVENANCE MATTERS HERE IN A WAY IT DOES NOT FOR A NIÑO BOX, AND IT IS WHY
  # THIS REGION IS NOT CALLED AN EEZ. An exclusive economic zone is a legal
  # instrument, and Canada and the United States do not agree about two pieces
  # of this one — the Dixon Entrance A-B line in the north and the wedge off
  # Juan de Fuca in the south. The geometry here is Fisheries and Oceans
  # Canada's own `Federal Marine Bioregions`: the union of the four it marks
  # Pacific — Offshore Pacific, Northern Shelf, Southern Shelf, Strait of
  # Georgia. That is the Canadian authority's rendering, and it reads Dixon
  # Entrance the Canadian way (measured: 152 cells at 54-55N that VLIZ's EEZ
  # excludes). It is a MARINE-PLANNING FRAMEWORK, not a maritime limit — the
  # dataset calls its own boundaries fuzzy and revisable on ecosystem grounds —
  # so the label names the bioregions and not the zone. The file records its
  # source, retrieval date and simplification.
  pacific_bioregions:
    group: canada
    label: Pacific Bioregions (DFO)
    polygon: pacific_bioregions.geojson
    about:
      why: >-
        Canada's Pacific waters off British Columbia, which both the 2014-2016
        Blob and the 2021 heat dome reached.
      definition: >-
        The union of the four Pacific bioregions in Fisheries and Oceans
        Canada's Federal Marine Bioregions: Offshore Pacific, Northern Shelf,
        Southern Shelf and Strait of Georgia. This is a marine planning
        framework, not a legal maritime boundary, which is why it is not called
        the EEZ. Where the boundary with the United States is unsettled, in
        Dixon Entrance and seaward of the Strait of Juan de Fuca, it follows
        Canada's position.
      references:
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"

  scotian_shelf:
    group: canada
    label: Scotian Shelf (DFO)
    polygon: scotian_shelf.geojson
    about:
      why: >-
        The continental shelf off Nova Scotia, in the fast-warming
        Northwest Atlantic. It has had abrupt warm events when warm
        slope water from the Gulf Stream side reached onto the shelf.
      definition: >-
        The Scotian Shelf bioregion in Fisheries and Oceans Canada's
        Federal Marine Bioregions, from the Bay of Fundy past
        Sable Island to the Laurentian Channel. It includes the water
        around Machias Seal Island and North Rock, following Canada's
        position where the United States disputes it. A marine planning
        framework, not a legal boundary.
      references:
        - authors: Brickman et al.
          year: 2018
          title: "Mechanism for the recent ocean warming events on the Scotian Shelf of eastern Canada"
          source: "Continental Shelf Research 156, 11-22"
          url: "https://doi.org/10.1016/j.csr.2018.01.001"
        - authors: Saba et al.
          year: 2016
          title: "Enhanced warming of the Northwest Atlantic Ocean under climate change"
          source: "Journal of Geophysical Research: Oceans 121, 118-132"
          url: "https://doi.org/10.1002/2015JC011346"
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
  gulf_st_lawrence:
    group: canada
    label: Gulf of St. Lawrence (DFO)
    polygon: gulf_st_lawrence.geojson
    about:
      why: >-
        A semi-enclosed sea fed at depth by Atlantic water through Cabot
        Strait. Its deep water has warmed and lost oxygen as more of
        that inflow comes from the warm Gulf Stream side rather than the
        Labrador Current. This dashboard sees only its surface.
      definition: >-
        The Gulf of Saint Lawrence bioregion in Fisheries and Oceans
        Canada's Federal Marine Bioregions, including the estuary. A
        marine planning framework, not a legal boundary.
      references:
        - authors: Gilbert et al.
          year: 2005
          title: "A seventy-two-year record of diminishing deep-water oxygen in the St. Lawrence estuary: The northwest Atlantic connection"
          source: "Limnology and Oceanography 50(5), 1654-1666"
          url: "https://doi.org/10.4319/lo.2005.50.5.1654"
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
  nl_shelves:
    group: canada
    label: Newfoundland-Labrador Shelves (DFO)
    polygon: nl_shelves.geojson
    about:
      why: >-
        The Labrador Current's shelves and the Grand Banks, where the
        northern cod fishery collapsed in 1992. Their ocean climate
        swings between cold and warm decades.
      definition: >-
        The Newfoundland-Labrador Shelves bioregion in Fisheries and
        Oceans Canada's Federal Marine Bioregions, with Saint-Pierre et
        Miquelon's French zone cut out. A marine planning framework, not
        a legal boundary.
      references:
        - authors: Cyr and Galbraith
          year: 2021
          title: "A climate index for the Newfoundland and Labrador shelf"
          source: "Earth System Science Data 13, 1807-1828"
          url: "https://doi.org/10.5194/essd-13-1807-2021"
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
  hudson_bay:
    group: canada
    label: Hudson Bay Complex (DFO)
    polygon: hudson_bay.geojson
    about:
      why: >-
        A shallow inland sea that freezes over every winter and clears
        in summer. Its ice now breaks up earlier and forms later,
        lengthening the open-water season. In winter its surface sits at
        freezing.
      definition: >-
        The Hudson Bay Complex bioregion in Fisheries and Oceans
        Canada's Federal Marine Bioregions: Hudson Bay, James Bay, Foxe
        Basin and Hudson Strait. A marine planning framework, not a
        legal boundary.
      references:
        - authors: Hochheim and Barber
          year: 2014
          title: "An update on the ice climatology of the Hudson Bay system"
          source: "Arctic, Antarctic, and Alpine Research 46(1), 66-83"
          url: "https://doi.org/10.1657/1938-4246-46.1.66"
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
  eastern_arctic:
    group: canada
    label: Eastern Arctic (DFO)
    polygon: eastern_arctic.geojson
    about:
      why: >-
        Baffin Bay, Davis Strait and the eastern entrances to the
        Northwest Passage, where the ice clears each summer. Arctic
        marine heatwaves start when sea ice melts early and the open
        water absorbs the summer sun.
      definition: >-
        The Eastern Arctic bioregion in Fisheries and Oceans Canada's
        Federal Marine Bioregions. A marine planning framework, not a
        legal boundary. Under ice, the surface sits at freezing and has
        no anomaly.
      references:
        - authors: Barkhordarian et al.
          year: 2024
          title: "Arctic marine heatwaves forced by greenhouse gases and triggered by abrupt sea-ice melt"
          source: "Communications Earth & Environment 5, 57"
          url: "https://doi.org/10.1038/s43247-024-01215-y"
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
  western_arctic:
    group: canada
    label: Western Arctic (DFO)
    polygon: western_arctic.geojson
    about:
      why: >-
        The Beaufort Sea and Amundsen Gulf, off the Mackenzie Delta.
        Summer ice loss lets the sun warm the surface ocean, and that
        heat now reaches the interior of the Beaufort Gyre.
      definition: >-
        The Western Arctic bioregion in Fisheries and Oceans Canada's
        Federal Marine Bioregions. Its western edge is the 141st
        meridian extended to sea, following Canada's position on the
        Beaufort Sea boundary, which the United States disputes. A
        marine planning framework, not a legal boundary.
      references:
        - authors: Timmermans et al.
          year: 2018
          title: "Warming of the interior Arctic Ocean linked to sea ice losses at the basin margins"
          source: "Science Advances 4(8), eaat6773"
          url: "https://doi.org/10.1126/sciadv.aat6773"
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
  arctic_basin:
    group: canada
    label: Arctic Basin (DFO)
    polygon: arctic_basin.geojson
    about:
      why: >-
        The deep ocean north of the Beaufort Sea and the archipelago,
        under ice for most of the year. Where summer ice has retreated,
        the surface ocean has warmed.
      definition: >-
        The Arctic Basin bioregion in Fisheries and Oceans Canada's
        Federal Marine Bioregions, out to the 200 nautical mile limit.
        Its western edge follows Canada's position on the disputed
        Beaufort Sea boundary. A marine planning framework, not a legal
        boundary. Under ice, the surface sits at freezing and has no
        anomaly.
      references:
        - authors: Steele et al.
          year: 2008
          title: "Arctic Ocean surface warming trends over the past 100 years"
          source: "Geophysical Research Letters 35, L02614"
          url: "https://doi.org/10.1029/2007GL031651"
        - authors: Fisheries and Oceans Canada
          title: "Federal Marine Bioregions"
          source: "Open Government Portal, record 23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"
          url: "https://open.canada.ca/data/en/dataset/23eb8b56-dac8-4efc-be7c-b8fa11ba62e9"

  # --- Added with the 2026-09-28 move to a global grid.
  #
  # Two kinds, and the provenance rule above is what separates them. An INDEX
  # box (IOD, ATL3, the globe, the Southern Ocean south of 60S) is a convention
  # anyone can write down and is a box by definition — a polygon would make it
  # wrong. A NAMED SEA is somebody's published outline, so it is a polygon whose
  # file records its source, licence, retrieval date and simplification, and
  # the label names that source.
  #
  # Several of these cross the PRIME meridian (the Mediterranean, the North
  # Atlantic, and ATL3 nearly does). Their longitudes are written unwrapped,
  # west before east — -6..36, not 354..36 — and `Region.gx_range` returns a
  # wrapping pair that `gx_sql()` turns into two key ranges. Sorting the pair, as
  # the code did while every region was Pacific, selects the complement.
  global:
    group: basins
    label: Global ocean
    # Every ocean cell CoralTemp has, poles included. The most expensive rollup
    # here, since it scans the whole archive.
    lat: [-89.975, 89.975]
    lon: [0.025, 359.975]
    about:
      why: >-
        The whole ocean as one number. Global sea surface temperature set a
        record in 2023 by a wide margin, and marine heatwave days have increased
        over the past century.
      definition: >-
        Every ocean cell in NOAA CoralTemp, poles included, averaged by area.
        Ice-covered cells have no anomaly.
      references:
        - authors: Skirving et al.
          year: 2020
          title: "CoralTemp and the Coral Reef Watch Coral Bleaching Heat Stress Product Suite Version 3.1"
          source: "Remote Sensing 12(23), 3856"
          url: "https://doi.org/10.3390/rs12233856"
        - authors: Oliver et al.
          year: 2018
          title: "Longer and more frequent marine heatwaves over the past century"
          source: "Nature Communications 9, 1324"
          url: "https://doi.org/10.1038/s41467-018-03732-9"
        - authors: Kuhlbrodt et al.
          year: 2024
          title: "A glimpse into the future: The 2023 ocean temperature and sea ice extremes in the context of longer-term climate change"
          source: "Bulletin of the American Meteorological Society 105(3), E474-E485"
          url: "https://doi.org/10.1175/BAMS-D-23-0209.1"
  n_atlantic:
    group: basins
    label: North Atlantic (GOaS)
    polygon: n_atlantic.geojson
    about:
      why: >-
        Its surface temperatures in 2023 broke the previous records by a wide
        margin, part of the run of ocean extremes that year.
      definition: >-
        The North Atlantic of the Global Oceans and Seas dataset: from the
        equator to the Arctic Ocean, including the Gulf of Mexico, the Caribbean
        and the North Sea, excluding the Mediterranean and the Baltic.
      references:
        - authors: Kuhlbrodt et al.
          year: 2024
          title: "A glimpse into the future: The 2023 ocean temperature and sea ice extremes in the context of longer-term climate change"
          source: "Bulletin of the American Meteorological Society 105(3), E474-E485"
          url: "https://doi.org/10.1175/BAMS-D-23-0209.1"
        - authors: Flanders Marine Institute (VLIZ)
          year: 2021
          title: "Global Oceans and Seas, version 1"
          source: "Marine Regions"
          url: "https://doi.org/10.14284/542"
  indian:
    group: basins
    label: Indian Ocean (GOaS)
    polygon: indian.geojson
    about:
      why: >-
        Home of the Indian Ocean Dipole. Its western half warmed faster than any
        other part of the tropical oceans over the past century, partly because
        of El Niño.
      definition: >-
        The Indian Ocean of the Global Oceans and Seas dataset, north of 60°S.
        It includes the Red Sea, the Persian Gulf and the Arabian Sea; the
        Indonesian seas are counted in the Pacific instead.
      references:
        - authors: Roxy et al.
          year: 2014
          title: "The curious case of Indian Ocean warming"
          source: "Journal of Climate 27, 8501-8509"
          url: "https://doi.org/10.1175/JCLI-D-14-00471.1"
        - authors: Saji et al.
          year: 1999
          title: "A dipole mode in the tropical Indian Ocean"
          source: "Nature 401, 360-363"
          url: "https://doi.org/10.1038/43854"
        - authors: Flanders Marine Institute (VLIZ)
          year: 2021
          title: "Global Oceans and Seas, version 1"
          source: "Marine Regions"
          url: "https://doi.org/10.14284/542"
  southern:
    group: basins
    label: Southern Ocean (S of 60S)
    # A box, not GOaS's polygon: GOaS draws the Southern Ocean's northern edge
    # at exactly 60S and its southern one at the Antarctic coast, which is land,
    # and land is already excluded by `sst_daily`. So the polygon would select
    # the same cells as this box, while its ring is cut at the antimeridian.
    # South edge is the grid's first row; north edge the last cell centre
    # south of 60S.
    lat: [-89.975, -60.025]
    lon: [0.025, 359.975]
    about:
      why: >-
        The ocean around Antarctica. Its surface has warmed much less than the
        rest of the ocean, because the circumpolar current brings up deep water
        that has not yet felt the warming. Antarctic sea ice reached record lows
        in 2023.
      definition: >-
        Everything south of 60°S, the usual northern limit of the Southern
        Ocean. Much of it is ice-covered for part of the year, and ice-covered
        cells have no anomaly.
      references:
        - authors: Armour et al.
          year: 2016
          title: "Southern Ocean warming delayed by circumpolar upwelling and equatorward transport"
          source: "Nature Geoscience 9, 549-554"
          url: "https://doi.org/10.1038/ngeo2731"
        - authors: Kuhlbrodt et al.
          year: 2024
          title: "A glimpse into the future: The 2023 ocean temperature and sea ice extremes in the context of longer-term climate change"
          source: "Bulletin of the American Meteorological Society 105(3), E474-E485"
          url: "https://doi.org/10.1175/BAMS-D-23-0209.1"
  # The Indian Ocean Dipole (Saji et al. 1999, Nature 401:360-363). The Dipole
  # Mode Index is west minus east anomaly; it is not stored, because a
  # difference of two rollups is not a third region. Both poles often move with
  # ENSO, which is why they sit beside the Nino boxes.
  iod_west:
    group: enso
    label: IOD west pole
    lat: [-10.0, 10.0]
    lon: [50.0, 70.0]
    about:
      why: >-
        The western pole of the Indian Ocean Dipole, ENSO's counterpart in the
        Indian Ocean. A positive dipole (this pole warm, the eastern one cool)
        shifts rainfall toward East Africa and away from Indonesia, and positive
        events often coincide with El Niño.
      definition: >-
        10°S-10°N, 50°E-70°E, as defined by Saji et al. (1999). The Dipole Mode
        Index is this pole's anomaly minus the eastern pole's; the dashboard
        shows each pole separately.
      references:
        - authors: Saji et al.
          year: 1999
          title: "A dipole mode in the tropical Indian Ocean"
          source: "Nature 401, 360-363"
          url: "https://doi.org/10.1038/43854"
  iod_east:
    group: enso
    label: IOD east pole
    lat: [-10.0, 0.0]
    lon: [90.0, 110.0]
    about:
      why: >-
        The eastern pole of the Indian Ocean Dipole, off Sumatra and Java. It
        cools during a positive dipole, when Indonesia and Australia tend to be
        dry.
      definition: >-
        10°S-0°, 90°E-110°E, as defined by Saji et al. (1999). The Dipole Mode
        Index is the western pole's anomaly minus this one's; the dashboard
        shows each pole separately.
      references:
        - authors: Saji et al.
          year: 1999
          title: "A dipole mode in the tropical Indian Ocean"
          source: "Nature 401, 360-363"
          url: "https://doi.org/10.1038/43854"
  # Atlantic Nino (Zebiak 1993): 20W-0, 3S-3N. East edge is the last cell
  # centre west of 0, not 360.0 — that would round to gx 0 and wrap the box
  # one column onto the far side of the meridian.
  atl3:
    group: enso
    label: Atlantic Nino (ATL3)
    lat: [-3.0, 3.0]
    lon: [340.0, 359.975]
    about:
      why: >-
        The Atlantic Niño: warm events in the eastern equatorial Atlantic that
        grow from the same kind of coupling between winds and ocean as El Niño,
        at a smaller scale.
      definition: >-
        3°S-3°N, 20°W-0°, the ATL3 region of Zebiak (1993).
      references:
        - authors: Zebiak
          year: 1993
          title: "Air-sea interaction in the equatorial Atlantic region"
          source: "Journal of Climate 6(8), 1567-1586"
          url: "https://doi.org/10.1175/1520-0442(1993)006<1567:AIITEA>2.0.CO;2"
  # --- Marine heatwave hotspots, each with a well-studied event.
  tasman_sea:
    group: mhw
    label: Tasman Sea (IHO)
    polygon: tasman_sea.geojson
    about:
      why: >-
        A marine heatwave hotspot between Australia and New Zealand, warming
        fast as the East Australian Current pushes further south. The 2015/16
        heatwave lasted 251 days.
      definition: >-
        The Tasman Sea as the International Hydrographic Organization defines it
        (IHO S-23).
      references:
        - authors: Oliver et al.
          year: 2017
          title: "The unprecedented 2015/16 Tasman Sea marine heatwave"
          source: "Nature Communications 8, 16101"
          url: "https://doi.org/10.1038/ncomms16101"
        - authors: Flanders Marine Institute (VLIZ)
          year: 2018
          title: "IHO Sea Areas, version 3"
          source: "Marine Regions"
          url: "https://doi.org/10.14284/323"
  mediterranean:
    group: mhw
    label: Mediterranean (IHO)
    polygon: mediterranean.geojson
    about:
      why: >-
        A nearly enclosed sea and a heatwave hotspot. The 2003 heatwave caused
        mass deaths of seafloor species in the northwest, and heatwaves from
        2015 to 2019 caused them across the whole basin.
      definition: >-
        The nine International Hydrographic Organization (IHO S-23) sea areas
        that make up the Mediterranean, joined. The Strait of Gibraltar, the Sea
        of Marmara and the Black Sea are excluded.
      references:
        - authors: Garrabou et al.
          year: 2009
          title: "Mass mortality in Northwestern Mediterranean rocky benthic communities: effects of the 2003 heat wave"
          source: "Global Change Biology 15, 1090-1103"
          url: "https://doi.org/10.1111/j.1365-2486.2008.01823.x"
        - authors: Garrabou et al.
          year: 2022
          title: "Marine heatwaves drive recurrent mass mortalities in the Mediterranean Sea"
          source: "Global Change Biology 28, 5708-5725"
          url: "https://doi.org/10.1111/gcb.16301"
        - authors: Flanders Marine Institute (VLIZ)
          year: 2018
          title: "IHO Sea Areas, version 3"
          source: "Marine Regions"
          url: "https://doi.org/10.14284/323"
  gulf_of_maine:
    group: mhw
    label: Gulf of Maine (SeaVoX)
    polygon: gulf_of_maine.geojson
    about:
      why: >-
        One of the fastest-warming parts of the ocean. Its 2012 heatwave upset
        the lobster season, and warming has held back the recovery of its
        collapsed cod fishery.
      definition: >-
        The Gulf of Maine, including the Bay of Fundy, from the SeaVoX sea-area
        gazetteer on Marine Regions. The IHO has no Gulf of Maine sea area.
      references:
        - authors: Pershing et al.
          year: 2015
          title: "Slow adaptation in the face of rapid warming leads to collapse of the Gulf of Maine cod fishery"
          source: "Science 350, 809-812"
          url: "https://doi.org/10.1126/science.aac9819"
        - authors: Mills et al.
          year: 2013
          title: "Fisheries management in a changing climate: Lessons from the 2012 ocean heat wave in the Northwest Atlantic"
          source: "Oceanography 26(2)"
          url: "https://doi.org/10.5670/oceanog.2013.27"
  # The Ningaloo Nino index box (Kataoka et al. 2014): 22-32S, from 108E to
  # the coast. The 2011 heatwave's footprint.
  w_australia:
    group: mhw
    label: Ningaloo Nino (W Australia)
    lat: [-32.0, -22.0]
    lon: [108.0, 116.0]
    about:
      why: >-
        The Ningaloo Niño: warm events off Western Australia, carried south by
        the Leeuwin Current and often forced by La Niña. The 2011 event pushed
        the kelp forests' range back by about 100 km, a shift that has
        persisted.
      definition: >-
        22°S-32°S, from 108°E to the coast: the Ningaloo Niño Index region of
        Kataoka et al. (2014).
      references:
        - authors: Kataoka et al.
          year: 2014
          title: "On the Ningaloo Niño/Niña"
          source: "Climate Dynamics 43, 1463-1482"
          url: "https://doi.org/10.1007/s00382-013-1961-z"
        - authors: Feng et al.
          year: 2013
          title: "La Niña forces unprecedented Leeuwin Current warming in 2011"
          source: "Scientific Reports 3, 1277"
          url: "https://doi.org/10.1038/srep01277"
        - authors: Wernberg et al.
          year: 2016
          title: "Climate-driven regime shift of a temperate marine ecosystem"
          source: "Science 353, 169-172"
          url: "https://doi.org/10.1126/science.aad8745"
  coral_triangle:
    group: mhw
    label: Coral Triangle (MEOW)
    polygon: coral_triangle.geojson
    about:
      why: >-
        The world's centre of marine biodiversity, with more coral species than
        anywhere else. Its reefs are exposed to the bleaching heat stress that
        NOAA CoralTemp was built to monitor.
      definition: >-
        The union of the Western and Eastern Coral Triangle provinces of Marine
        Ecoregions of the World (Spalding et al. 2007). It is not the scientific
        boundary of Veron et al. (2009). The provinces are coastal and shelf
        regions, so the deep basins inside the triangle are left out.
      references:
        - authors: Veron et al.
          year: 2009
          title: "Delineating the Coral Triangle"
          source: "Galaxea, Journal of Coral Reef Studies 11, 91-100"
          url: "https://doi.org/10.3755/galaxea.11.91"
        - authors: Spalding et al.
          year: 2007
          title: "Marine Ecoregions of the World: A bioregionalization of coastal and shelf areas"
          source: "BioScience 57(7), 573-583"
          url: "https://doi.org/10.1641/B570707"
        - authors: Skirving et al.
          year: 2020
          title: "CoralTemp and the Coral Reef Watch Coral Bleaching Heat Stress Product Suite Version 3.1"
          source: "Remote Sensing 12(23), 3856"
          url: "https://doi.org/10.3390/rs12233856"

# Quantities a timeseries can report that are NOT fields on the map.
#
# Everything in `variables` above is something `/image` can draw, and the
# frontend's variable toggle is built from that block — so a quantity that has no
# raster cannot live there without appearing as a fourth map layer that renders
# nothing. This block is the other kind: presentation metadata (name, unit,
# precision, colour ramp) for a number that only exists once cells have been
# aggregated over an area.
#
# There is one, and it is what `mhw` means over a REGION. A box's marine-heatwave
# value used to be `sum(cat * cos(lat)) / sum(cos(lat))` — an area mean of
# NOAA's five ordinal classes, which is not a class and mixes severity with
# extent so thoroughly that half a box at Cat 1 and a tenth of it at Cat 5 both
# come to about 0.5. The panel carried four sentences of warning to that effect.
# The share of the box's ocean area that is in a heatwave at all answers the
# question people actually ask of a region, needs no warning, and is the number
# the ribbon reports for the basin.
#
# A POINT is untouched: there the value is a class, `mhw` names it, and an
# "extent" at one cell would be 0% or 100%.
quantities:
  mhw_extent:
    long_name: Share of the region in a marine heatwave
    short_name: MHW extent
    units: '%'
    # One decimal. The basin moves by a few tenths of a percent a day and the
    # ribbon reports it against a day-of-year normal, so a whole number would
    # round away the change the ribbon is there to show.
    precision: 1
    # 0..100 is the whole possible range, not a display choice: the ramp is
    # spread over it and nothing can land outside.
    vmin: 0.0
    vmax: 100.0
    # Sequential, and warm: this is an amount of something bad, with no
    # meaningful midpoint for a diverging map to invent. Deliberately not the
    # five NOAA category colours — an extent is not a category, and reusing that
    # palette is precisely the confusion this quantity exists to end.
    colormap: YlOrRd
